
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: founder-ke-samaan-web

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

    environment:
      NODE_ENV: development

volumes:
  node_modules:
  next_cache:
